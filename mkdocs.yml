site_name: Interpretador de C
repo_url: https://github.com/m0yo/Compiladores_G08

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

nav:
  - Início: index.md
  - Trabalho de Compiladores: trabalho_compiladores.md
  - Contribuição:
    - Documentação: docs.md
    - Guia de Commits: contributing.md
  - Como executar: como_executar.md
  - Scanner:
    - Analisador Léxico: lexer.md
    - Expressões Regulares: expressoesRegularesFlex.md
  - Parser:
    - Gramática: gramatica.md
  - Interpretador:
    - AST e Avaliador: ast.md
    - Tabela de Símbolos: tabela_simbolos.md
